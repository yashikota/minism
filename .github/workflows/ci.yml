name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          mods=$(find . -name go.mod -not -path './.git/*' -exec dirname {} \; | sort | jq -R . | jq -sc .)
          echo "modules=$mods" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Some upstreams (OpenBao) need a newer Go than the runner image has;
          # GOTOOLCHAIN=auto fetches the toolchain named in go.mod / go.work.
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - run: gofmt -l . | tee /dev/stderr | (! grep .)
      - run: go vet ./...
      - name: prefetch (network is allowed only in this step)
        run: |
          go mod download
          go test -race -count=1 -run '^$' ./...
      - name: tests with the network cut off
        # In-memory requirement: a fresh network namespace has no route out and
        # nothing can be reached on loopback either (lo is down), so any real
        # socket use fails. Root is needed because Ubuntu 24.04 restricts
        # unprivileged user namespaces; drop back to the runner user for go.
        run: |
          sudo unshare --net -- sudo -u "$USER" -E env "PATH=$PATH" "HOME=$HOME" \
            "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOTOOLCHAIN=$(go env GOTOOLCHAIN)" \
            go test -race -count=1 ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
